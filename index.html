<title>Panel Sewi — Sigmatiserie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: one square CRT "screen" that boots like a 90s fighting game and settles on the album cover. Single dark arcade look. */
:root {
  --void: #07041a;        /* cabinet black, violet bias */
  --violet: #3b12d6;      /* the art's backdrop */
  --magenta: #ff2e97;     /* the art's offset kanji */
  --bone: #fbf7ff;        /* pixel white */
  --gold: #ffc531;        /* ring gold / health bar */
  --ink: #000;
  --f-pixel: "Press Start 2P", "Courier New", monospace;
  --f-jp: "DotGothic16", "MS Gothic", "Osaka", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 0%, #1a0b4a 0%, var(--void) 60%) fixed, var(--void);
  color: var(--bone);
  font-family: var(--f-jp);
  padding-inline: 16px;
  padding-block: 24px;
  box-sizing: border-box;
  display: grid;
  place-items: center;
}
.stage { display: grid; gap: 18px; justify-items: center; width: 100%; }

/* ---------- the cover ---------- */
.cover {
  position: relative;
  width: min(100%, 640px, 78vh);
  aspect-ratio: 1;
  max-width: 100%;
  container-type: inline-size;
  overflow: hidden;
  background: var(--violet);
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--magenta), 0 30px 80px -20px rgba(59,18,214,.7);
  image-rendering: pixelated;
  cursor: pointer;
}
.cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(7,4,26,.92) 0%, rgba(7,4,26,.55) 26%, transparent 46%),
    linear-gradient(to bottom, rgba(7,4,26,.7) 0%, transparent 18%);
}


/* vertical katakana, echoing the art */
.vert {
  position: absolute; right: 3.4cqw; top: 6cqw;
  writing-mode: vertical-rl; font-family: var(--f-jp);
  font-size: 6.4cqw; line-height: 1; letter-spacing: .08em;
  color: var(--bone);
  text-shadow: .7cqw .7cqw 0 var(--magenta), .3cqw .3cqw 0 var(--ink);
}

/* title block */
.title {
  position: absolute; left: 4.5cqw; right: 4.5cqw; bottom: 4.2cqw;
  display: grid; gap: 2.2cqw;
}
.logo {
  margin: 0; font-family: var(--f-pixel); font-weight: 400;
  line-height: .95; color: var(--bone);
  text-shadow:
    .9cqw .9cqw 0 var(--magenta),
    -.4cqw 0 0 var(--ink), .4cqw 0 0 var(--ink), 0 -.4cqw 0 var(--ink), 0 .4cqw 0 var(--ink),
    1.3cqw 1.3cqw 0 var(--ink);
  display: grid; gap: 1.6cqw;
}
.logo .l1 { font-size: 8.4cqw; letter-spacing: .06em; color: var(--gold); }
.logo .l2 { font-size: 15.2cqw; letter-spacing: .02em; }
.series {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5cqw 3cqw;
  background: var(--ink); color: var(--bone);
  padding: 1.6cqw 2.2cqw; box-shadow: .9cqw .9cqw 0 var(--magenta);
}
.series b { font-family: var(--f-pixel); font-weight: 400; font-size: 3.2cqw; letter-spacing: .28em; }
.series span { font-size: 3cqw; color: var(--magenta); letter-spacing: .1em; }
.start {
  justify-self: end; font-family: var(--f-pixel); font-size: 2.5cqw; color: var(--bone);
  text-shadow: .35cqw .35cqw 0 var(--ink); letter-spacing: .12em;
  animation: blink 1.05s steps(1) infinite;
}
.copy { position: absolute; left: 4.5cqw; bottom: 1.2cqw; font-family: var(--f-pixel); font-size: 1.5cqw; opacity: .7; letter-spacing: .1em; }

/* CRT glass */
.crt {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%);
}
.glare { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.08), transparent 35%); }

/* ---------- intro layers ---------- */
.boot, .flash { position: absolute; inset: 0; pointer-events: none; }
.boot {
  background: var(--ink); display: grid; place-content: center; justify-items: center; gap: 3.4cqw;
  text-align: center; opacity: 0;
}
.boot .studio { font-family: var(--f-pixel); font-size: 5.4cqw; letter-spacing: .14em; color: var(--bone); }
.boot .studio em { font-style: normal; color: var(--magenta); }
.boot .soft { font-family: var(--f-jp); font-size: 3.6cqw; color: var(--gold); letter-spacing: .5em; }
.boot .pres { font-family: var(--f-pixel); font-size: 2.2cqw; color: #9c8cff; letter-spacing: .3em; }
.boot .studio span { visibility: hidden; }
.boot .studio span.on { visibility: visible; }
.flash { background: var(--bone); opacity: 0; }

/* state machine */
.cover[data-phase="boot"] .boot { opacity: 1; }
.cover[data-phase="boot"] :is(.vert,.title,.copy,.shade) { visibility: hidden; }
.cover[data-phase="reveal"] :is(.vert,.title,.copy) { visibility: hidden; }
.cover[data-phase="slam"] .copy { visibility: hidden; }
.cover[data-phase="slam"] .logo .l2 { animation: slam .55s steps(6) both; }
.cover[data-phase="slam"] .logo .l1 { animation: slide .4s steps(5) both; }
.cover[data-phase="slam"] .series { animation: slide .4s .2s steps(5) both; }
.cover[data-phase="slam"] .vert { animation: drop .5s .15s steps(7) both; }
.cover[data-phase="slam"] .start { visibility: hidden; }
.cover[data-phase="hud"] .copy { animation: slide .35s steps(4) both; }
.flash.go { animation: flash .38s steps(3) both; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes slam { 0% { transform: scale(3.2); opacity: 0; } 60% { transform: scale(.94); opacity: 1; } 100% { transform: scale(1); } }
@keyframes slide { from { transform: translateX(-110%); } to { transform: none; } }
@keyframes drop { from { transform: translateY(-60cqw); } to { transform: none; } }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.cover.shake { animation: shake .3s steps(6); }
@keyframes shake { 25% { transform: translate(1.2cqw,-.6cqw); } 50% { transform: translate(-1cqw,.8cqw); } 75% { transform: translate(.6cqw,.4cqw); } }

/* ---------- controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  font-family: var(--f-pixel); font-size: 11px; letter-spacing: .12em;
  color: var(--bone); background: var(--ink);
  border: 3px solid var(--bone); padding: 12px 16px; cursor: pointer;
  box-shadow: 4px 4px 0 var(--magenta);
}
.btn:hover { background: var(--violet); }
.btn:active { transform: translate(4px,4px); box-shadow: none; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.primary { color: var(--ink); background: var(--gold); border-color: var(--ink); }
.btn.primary:hover { background: #ffd866; }
.note { margin: 0; font-size: 13px; color: #a99ee0; text-align: center; max-width: 52ch; line-height: 1.6; }

@media (prefers-reduced-motion: reduce) {
  .start { animation: none; }
}
</style>

<main class="stage">
  <div class="cover" id="cover" data-phase="rest" role="img" aria-label="Album cover: Panel Sewi, Sigmatiserie. A rapper in a black durag and hoodie throws a ringed fist toward the viewer on a violet background, framed as a 1990s game title screen. © 2026 V-Devil Entertainment.">
    <canvas id="art" width="1024" height="1024"></canvas>
    <div class="shade"></div>


    <div class="vert" aria-hidden="true">パネル・セウィ</div>

    <div class="title">
      <h1 class="logo"><span class="l1">PANEL</span><span class="l2">SEWI</span></h1>
      <div class="series"><b>SIGMATISERIE</b><span>シグマティセリー</span></div>
      <div class="start" aria-hidden="true">▶ PRESS START</div>
    </div>
    <div class="copy" aria-hidden="true">© 2026 V-DEVIL ENTERTAINMENT</div>

    <div class="boot" aria-hidden="true">
      <div class="studio" id="studio"></div>
      <div class="soft">ソフト</div>
      <div class="pres">PRESENTS</div>
    </div>
    <div class="flash" id="flash"></div>
    <div class="crt"></div>
    <div class="glare"></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="play" type="button">▶ PRESS START</button>
    <button class="btn" id="skip" type="button">SKIP INTRO</button>
    <button class="btn" id="mute" type="button" aria-pressed="false">SOUND: ON</button>
  </div>
  <p class="note">Press start to replay the boot intro with sound: a chiptune jingle, then the voice tag once the cover lands. Tap the screen to skip ahead.</p>
</main>

  // Square crop around the fist and face (source is 1179x685).
  function crop() {
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    return { sx: Math.round((img.naturalWidth - s) * 0.62), sy: 0, s };
  }
  // Pixelate: draw tiny, then scale up with smoothing off.
  const tiny = document.createElement('canvas');
  const tctx = tiny.getContext('2d');
  function draw(block) {
    if (!img.complete || !img.naturalWidth) return;
    const { sx, sy, s } = crop();
    const W = canvas.width;
    if (block <= 1) {
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, sx, sy, s, s, 0, 0, W, W);
      return;
    }
    const n = Math.max(2, Math.round(W / block));
    tiny.width = tiny.height = n;
    tctx.imageSmoothingEnabled = true;
    tctx.drawImage(img, sx, sy, s, s, 0, 0, n, n);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tiny, 0, 0, n, n, 0, 0, W, W);
  }

  outro.preload = "auto";
  function playOutro() {
    if (muted) return;
    try { outro.currentTime = 0; outro.play().catch(() => {}); } catch {}
  }
  function tone(freq, t, dur, type = 'square', vol = .06) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  const N = f => 440 * Math.pow(2, (f - 69) / 12);
  function jingle() {
    if (muted) return;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch { return; }
    const t0 = ac.currentTime + .05;
    // boot blips under the logo
    for (let i = 0; i < NAME.length; i++) tone(N(84 + (i % 3) * 2), t0 + i * .08, .05, 'square', .035);
    // fanfare at the reveal: minor riff, then the title hit
    const riff = [[57,0],[60,.15],[64,.3],[69,.45],[67,.75],[64,.9],[67,1.05],[72,1.2]];
    const r0 = t0 + 1.6;
    riff.forEach(([m, d]) => tone(N(m), r0 + d, .14, 'square', .05));
    riff.forEach(([m, d]) => tone(N(m - 24), r0 + d, .14, 'triangle', .12));
    [57, 64, 69, 72].forEach(m => tone(N(m), r0 + 1.55, .7, 'sawtooth', .025));
    tone(N(33), r0 + 1.55, .8, 'triangle', .22);
    // noise-ish hit
    tone(90, r0 + 1.55, .25, 'square', .08);

    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(raf);
  }
  function hit() {
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    cover.classList.remove('shake'); void cover.offsetWidth; cover.classList.add('shake');
  }
  function rest() {
    clear();
    outro.pause();
    cover.dataset.phase = 'rest';
    letters().forEach(s => s.classList.add('on'));
    draw(1);
  }
  function play(withSound) {
    clear();
    if (reduce) { rest(); return; }
    outro.pause();
    if (withSound) jingle();
    cover.dataset.phase = 'boot';
    letters().forEach(s => s.classList.remove('on'));
    ctx.clearRect(0, 0, canvas.width, canvas.width);
    letters().forEach((s, i) => later(80 + i * 80, () => s.classList.add('on')));

        const levels = [128, 96, 64, 48, 32, 24, 16, 10, 6, 3, 1];
        draw(levels[Math.min(levels.length - 1, Math.floor(p * levels.length))]);

      };
      raf = requestAnimationFrame(step);

    later(3900, () => { cover.dataset.phase = 'hud'; });
    later(5200, () => { cover.dataset.phase = 'rest'; if (withSound) playOutro(); });

  img.onload = () => { if (cover.dataset.phase === 'rest') draw(1); };
  document.getElementById('play').addEventListener('click', () => play(true));
  document.getElementById('skip').addEventListener('click', rest);
  cover.addEventListener('click', () => { cover.dataset.phase === 'rest' ? play(true) : rest(); });
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
    muteBtn.setAttribute('aria-pressed', String(muted));
  });

  // Attract mode: run the intro silently once on load (sound needs a tap).
  if (img.complete) play(false); else img.addEventListener('load', () => play(false), { once: true });
})();
